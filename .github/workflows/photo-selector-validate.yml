name: Photo Selector validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [photo-selection, main]
    paths:
      - 'photo-selector.mjs'
      - 'wallpanel-src.js'
      - 'custom_components/wallpanel_photo_selector/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/photo-selector-validate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check wallpanel-src.js
          node --check photo-selector.mjs
      - name: JavaScript unit tests
        run: node --test tests/*.test.mjs tests/*.test.cjs
      - name: Python scanner tests
        run: python -m unittest discover -s tests -p 'test_wallpanel_photo_selector_scanner.py'
      - name: Install build dependencies
        run: npm ci
      - name: Build wallpanel.js
        run: npm run build
      - name: Verify compiled bundle contains Photo Selector features
        run: |
          test -s wallpanel.js
          grep -q 'show_on_orientation' wallpanel.js
          grep -q 'photo_selector_rating_frequencies' wallpanel.js
          grep -q 'photo_selector_history_size' wallpanel.js
      - name: Commit compiled frontend on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if ! git diff --quiet -- wallpanel.js || ! git ls-files --error-unmatch wallpanel.js >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wallpanel.js
            git commit -m "Build wallpanel.js for HACS"
            git push
          fi
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-photo-selector-build
          path: wallpanel.js
          if-no-files-found: error
